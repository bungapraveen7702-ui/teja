apiVersion: v1
kind: Service
metadata:
  name: cake-site-service
  labels:
    app: cake-site
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: cake-site
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
